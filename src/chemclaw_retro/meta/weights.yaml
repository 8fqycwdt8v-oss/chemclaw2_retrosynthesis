# Heuristic weights for the meta-aggregator. Keep round-trip and consensus
# dominant since those signals are model-agnostic.
#
# Score is a linear combination:
#   final = rrf * rrf_score
#         + consensus_count * group.consensus_count
#         + round_trip_ok                       # added iff forward model reproduces target
#         + rascore_norm * rascore_min          # higher rascore → higher final
#         + scscore_norm * (5 - scscore_max)/4  # lower scscore → higher final
#         + rxnfp_class_match                   # added iff rxnfp class matches expectation
#
# Anything not listed here defaults to the values baked into
# HeuristicReranker.score. rrf_k (the RRF constant) is an aggregator
# argument, not a weight — to tune it, override the kwarg in
# server.routes.single_step.aggregate(...).

rrf: 1.0
consensus_count: 0.5
round_trip_ok: 2.0
rascore_norm: 1.0
scscore_norm: 0.3
rxnfp_class_match: 0.4
