[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chemclaw-retro"
version = "0.1.0"
description = "Meta-model retrosynthesis MCP server combining many open-source single-step and multi-step engines."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "chemclaw2_retrosynthesis contributors" }]
keywords = ["chemistry", "retrosynthesis", "mcp", "fastapi", "cheminformatics", "ensemble"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "fastapi>=0.115",
    "fastapi-mcp>=0.3",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=9.0",
    "rdkit>=2024.3.1",
]

[project.optional-dependencies]
scoring = [
    # RAscore depends on legacy TF; pulled in only when the gateway is built
    # against the scoring profile. SCScore / SAscore ship via RDKit contrib.
    "scikit-learn>=1.4",
]
classify = [
    # rxnfp pins an older transformers; install in its own container profile.
]
aizynth = [
    "aizynthfinder>=4.4",
]
retrosim = [
    # rdchiral required for RetroSim's template application
    "rdchiral>=1.1",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "httpx>=0.27",
]
training = [
    "lightgbm>=4.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "onnxmltools>=1.12",
]

[project.scripts]
chemclaw-retro = "chemclaw_retro.cli:app"

[project.urls]
Homepage = "https://github.com/8fqycwdt8v-oss/chemclaw2_retrosynthesis"

[tool.hatch.build.targets.wheel]
packages = ["src/chemclaw_retro"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI uses Depends() in defaults

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["chemclaw_retro"]
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Heavy ML deps are loaded inside backend containers, not the gateway.
module = ["rdkit.*", "rdchiral.*", "aizynthfinder.*", "rxnmapper.*", "rxnfp.*", "rascore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
