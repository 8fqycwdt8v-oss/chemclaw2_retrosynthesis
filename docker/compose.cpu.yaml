# CPU-only smoke compose: gateway + AiZynthFinder + RetroSim. Runs
# end-to-end on a laptop; CI can use the same file.
#
# Round-trip forward validation is OFF-by-default in this profile —
# chemformer needs a GPU. Set CHEMCLAW_RETRO_FORWARD_URL in your shell
# to point at any /forward-capable backend you bring up separately, or
# call /retrosynthesis/single_step with run_round_trip=false.
#
# Heavier backends (Chemformer, LocalRetro, MEGAN, ...) live in
# compose.yaml under the phase2/phase3/phase4 profiles.

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CHEMCLAW_RETRO_LOG_LEVEL: info
      # Only the CPU-friendly backends are enabled out of the box.
      CHEMCLAW_RETRO_BACKEND_AIZYNTH__ENABLED: "true"
      CHEMCLAW_RETRO_BACKEND_RETROSIM__ENABLED: "true"
      # No GPU forward backend in this profile; point at aizynth so the
      # forward URL resolves even though aizynth itself doesn't expose
      # /forward (round-trip calls just degrade quietly). Override via
      # the host env to point at a real forward backend.
      CHEMCLAW_RETRO_FORWARD_URL: ${CHEMCLAW_RETRO_FORWARD_URL:-http://aizynth:9000}
    depends_on:
      - aizynth
      - retrosim

  aizynth:
    build:
      context: ..
      dockerfile: docker/backends/aizynth.Dockerfile
    ports:
      - "9001:9000"
    volumes:
      - ../weights:/weights:ro

  retrosim:
    build:
      context: ..
      dockerfile: docker/backends/retrosim.Dockerfile
    ports:
      - "9002:9000"
    volumes:
      - ../weights:/weights:ro
