# AUTO-GENERATED by scripts/gen_compose.py from the backend catalogue.
# Do NOT edit by hand — change the ``deploy`` field on the matching
# adapter in src/chemclaw_retro/backends/adapters/ and re-run the
# generator.
#
# Use `--profile <name>` to bring up subsets:
#   docker compose --profile template     up
#   docker compose --profile transformer  up
#   docker compose --profile graph        up
#   docker compose --profile planner      up
#   docker compose --profile llm          up
#   docker compose --profile biocatalysis up
#
# Without a profile, only the gateway + Phase-1 backends start (see
# compose.cpu.yaml).

include:
  - compose.cpu.yaml

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - capabilities: [gpu]
  volumes:
    - ../weights:/weights:ro
  restart: unless-stopped

x-cpu: &cpu
  volumes:
    - ../weights:/weights:ro
  restart: unless-stopped

services:

  # ---- Biocatalysis / natural products ----

  enzyformer:
    <<: *gpu
    profiles: [phase4, biocatalysis]
    build: { context: .., dockerfile: docker/backends/enzyformer.Dockerfile }
    ports: ["9063:9000"]

  readretro:
    <<: *gpu
    profiles: [phase4, biocatalysis]
    build: { context: .., dockerfile: docker/backends/readretro.Dockerfile }
    ports: ["9060:9000"]

  retrobiocat:
    <<: *cpu
    profiles: [phase4, biocatalysis]
    build: { context: .., dockerfile: docker/backends/retrobiocat.Dockerfile }
    ports: ["9061:9000"]

  retropath:
    <<: *cpu
    profiles: [phase4, biocatalysis]
    build: { context: .., dockerfile: docker/backends/retropath.Dockerfile }
    ports: ["9062:9000"]

  # ---- Graph family ----

  g2retro:
    <<: *gpu
    profiles: [phase2, graph]
    build: { context: .., dockerfile: docker/backends/g2retro.Dockerfile }
    ports: ["9035:9000"]

  gln:
    <<: *gpu
    profiles: [phase2, graph]
    build: { context: .., dockerfile: docker/backends/gln.Dockerfile }
    ports: ["9034:9000"]

  graph2smiles:
    <<: *gpu
    profiles: [phase2, graph]
    build: { context: .., dockerfile: docker/backends/graph2smiles.Dockerfile }
    ports: ["9030:9000"]

  graphretro:
    <<: *gpu
    profiles: [phase2, graph]
    build: { context: .., dockerfile: docker/backends/graphretro.Dockerfile }
    ports: ["9032:9000"]

  megan:
    <<: *gpu
    profiles: [phase2, graph]
    build: { context: .., dockerfile: docker/backends/megan.Dockerfile }
    ports: ["9031:9000"]

  retrobridge:
    <<: *gpu
    profiles: [phase2, graph]
    build: { context: .., dockerfile: docker/backends/retrobridge.Dockerfile }
    ports: ["9033:9000"]

  # ---- Hybrid (planner-side) ----

  deepretro:
    <<: *cpu
    profiles: [phase3, llm]
    build: { context: .., dockerfile: docker/backends/deepretro.Dockerfile }
    ports: ["9054:9000"]
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

  retrochimera:
    <<: *gpu
    profiles: [phase3, planner]
    build: { context: .., dockerfile: docker/backends/retrochimera.Dockerfile }
    ports: ["9047:9000"]

  # ---- LLM-style (single shared image, env-driven) ----

  batgpt:
    <<: *gpu
    profiles: [phase3, llm]
    build: { context: .., dockerfile: docker/backends/hf_llm.Dockerfile }
    ports: ["9052:9000"]
    environment:
      BACKEND_NAME: batgpt
      BACKEND_CITATION: "Liu et al., arXiv:2408.10285"
      BACKEND_URL: "https://arxiv.org/abs/2408.10285"
      HF_MODEL_ID: "${BATGPT_HF_MODEL_ID:?BATGPT_HF_MODEL_ID must be set in the host env}"

  chemdfm:
    <<: *gpu
    profiles: [phase3, llm]
    build: { context: .., dockerfile: docker/backends/hf_llm.Dockerfile }
    ports: ["9051:9000"]
    environment:
      BACKEND_NAME: chemdfm
      BACKEND_CITATION: "Zhao et al., arXiv:2401.14818"
      BACKEND_URL: "https://huggingface.co/OpenDFM/ChemDFM-13B-v1.0"
      HF_MODEL_ID: "${CHEMDFM_HF_MODEL_ID:-OpenDFM/ChemDFM-13B-v1.0}"

  retrodfm:
    <<: *gpu
    profiles: [phase3, llm]
    build: { context: .., dockerfile: docker/backends/hf_llm.Dockerfile }
    ports: ["9053:9000"]
    environment:
      BACKEND_NAME: retrodfm
      BACKEND_CITATION: "arXiv:2507.17448"
      BACKEND_URL: "https://arxiv.org/abs/2507.17448"
      HF_MODEL_ID: "${RETRODFM_HF_MODEL_ID:-OpenDFM/RetroDFM-R}"

  rsgpt:
    <<: *gpu
    profiles: [phase3, llm]
    build: { context: .., dockerfile: docker/backends/hf_llm.Dockerfile }
    ports: ["9050:9000"]
    environment:
      BACKEND_NAME: rsgpt
      BACKEND_CITATION: "Liu et al., Nat. Commun. 2025"
      BACKEND_URL: "https://github.com/jogjogee/RSGPT"
      BACKEND_LICENSE: MIT
      HF_MODEL_PATH: "${RSGPT_CKPT:-/weights/rsgpt}"
      LLM_MAX_NEW_TOKENS: "192"

  # ---- Heavy planners ----

  askcos:
