  het-retro:
    <<: *gpu
    profiles: [phase2, transformer]
    build: { context: .., dockerfile: docker/backends/het_retro.Dockerfile }
    ports: ["9028:9000"]

  retroxpert:
    <<: *gpu
    profiles: [phase2, transformer]  # disabled by default — see adapter docstring
    build: { context: .., dockerfile: docker/backends/retroxpert.Dockerfile }
    ports: ["9029:9000"]

  # ---- Graph family ----
  graph2smiles:
    <<: *gpu
    profiles: [phase2, graph]
    build: { context: .., dockerfile: docker/backends/graph2smiles.Dockerfile }
    ports: ["9030:9000"]

  megan:
