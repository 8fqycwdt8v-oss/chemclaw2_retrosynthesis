  # ---- LLM-style ----
  rsgpt:
    <<: *gpu
    profiles: [phase3, llm]
    build: { context: .., dockerfile: docker/backends/rsgpt.Dockerfile }
    ports: ["9050:9000"]

  chemdfm:
    <<: *gpu
    profiles: [phase3, llm]
    build: { context: .., dockerfile: docker/backends/chemdfm.Dockerfile }
