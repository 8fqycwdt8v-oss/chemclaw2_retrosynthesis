# Full stack — every wrapped backend, GPU profiles where applicable.
#
# Use `--profile <name>` flags to bring up subsets:
#   docker compose --profile template     up
#   docker compose --profile transformer  up
#   docker compose --profile graph        up
#   docker compose --profile planner      up
#   docker compose --profile llm          up
#   docker compose --profile biocatalysis up
#
# Without a profile, only the gateway + Phase-1 backends start (see
# compose.cpu.yaml).

include:
  - compose.cpu.yaml

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - capabilities: [gpu]
  volumes:
    - ../weights:/weights:ro
  restart: unless-stopped

x-cpu: &cpu
  volumes:
    - ../weights:/weights:ro
  restart: unless-stopped

services:
  # ---- Template family ----
  localretro:
    <<: *gpu
    profiles: [phase2, template]
    build: { context: .., dockerfile: docker/backends/localretro.Dockerfile }
    ports: ["9010:9000"]

  mhnreact:
    <<: *gpu
    profiles: [phase2, template]
    build: { context: .., dockerfile: docker/backends/mhnreact.Dockerfile }
    ports: ["9011:9000"]

  neuralsym:
    <<: *gpu
    profiles: [phase2, template]
    build: { context: .., dockerfile: docker/backends/neuralsym.Dockerfile }
    ports: ["9012:9000"]

  retrocomposer:
    <<: *gpu
    profiles: [phase2, template]
    build: { context: .., dockerfile: docker/backends/retrocomposer.Dockerfile }
    ports: ["9013:9000"]

  # ---- Transformer family ----
  chemformer:
    <<: *gpu
    profiles: [phase2, transformer]
    build: { context: .., dockerfile: docker/backends/chemformer.Dockerfile }
    ports: ["9020:9000"]

  rsmiles:
    <<: *gpu
    profiles: [phase2, transformer]
    build: { context: .., dockerfile: docker/backends/rsmiles.Dockerfile }
    ports: ["9021:9000"]

  retroprime:
    <<: *gpu
    profiles: [phase2, transformer]
    build: { context: .., dockerfile: docker/backends/retroprime.Dockerfile }
    ports: ["9022:9000"]

  retroformer:
    <<: *gpu
    profiles: [phase2, transformer]
    build: { context: .., dockerfile: docker/backends/retroformer.Dockerfile }
    ports: ["9023:9000"]

  t5chem:
    <<: *gpu
    profiles: [phase2, transformer]
    build: { context: .., dockerfile: docker/backends/t5chem.Dockerfile }
    ports: ["9024:9000"]

  disc-chemformer:
    <<: *gpu
    profiles: [phase2, transformer]
    build: { context: .., dockerfile: docker/backends/disconnection_chemformer.Dockerfile }
    ports: ["9025:9000"]

  tied-twoway:
    <<: *gpu
    profiles: [phase2, transformer]
    build: { context: .., dockerfile: docker/backends/tied_twoway.Dockerfile }
    ports: ["9026:9000"]

  fusionretro:
    <<: *gpu
    profiles: [phase2, transformer]
    build: { context: .., dockerfile: docker/backends/fusionretro.Dockerfile }
